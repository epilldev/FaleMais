
<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
	<meta charset="UTF-8"/>
</head>

<body>

<nav class="sidebar"
	 id="menu-principal"
	 th:fragment="nav-sidebar"
	 aria-label="Menu principal">

	<ul class="nav nav-pills flex-column">

		<!-- Página inicial -->
		<li class="nav-item">
			<a class="nav-link"
			   th:href="@{/}"
			   th:classappend="${#httpServletRequest.requestURI == '/' ? 'active' : ''}">

				<i class="oi oi-home" aria-hidden="true"></i>
				<span>Início</span>

			</a>
		</li>

		<!-- Calculadora de chamadas -->
		<li class="nav-item">
			<a class="nav-link"
			   th:href="@{/chamadas/calculo}"
			   th:classappend="${#httpServletRequest.requestURI == '/chamadas/calculo' ? 'active' : ''}">

				<i class="oi oi-calculator" aria-hidden="true"></i>
				<span>Calcular</span>

			</a>
		</li>

		<!-- Listagem de planos -->
		<li class="nav-item">
			<a class="nav-link"
			   th:href="@{/chamadas/lista}"
			   th:classappend="${#httpServletRequest.requestURI == '/chamadas/lista' ? 'active' : ''}">

				<i class="oi oi-spreadsheet" aria-hidden="true"></i>
				<span>Listar planos</span>

			</a>
		</li>

	</ul>

</nav>

</body>
</html>
